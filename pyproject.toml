[project]
name = "pseudo-task-agents-dev"
version = "0.1.0"
description = "Development for experiments on generating pseudo-tasks for GNNs using LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "peft>=0.19.1",
    "plotly>=6.7.0",
    "ray>=2.54.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.4.0",
    "torch-geometric>=2.7.0",
    "transformers>=4.57.6",
    "vllm>=0.19.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
